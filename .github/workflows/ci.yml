name: MindCheck CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check Code Formatting with Black
        run: |
          black --check --diff src/ tests/ scripts/

      - name: Check Import Sorting with isort
        run: |
          isort --check-only --diff src/ tests/ scripts/

      - name: Lint with Flake8
        run: |
          # Uses the thresholds and exclusions declared in .flake8; no
          # exit-zero escape hatch, so real lint violations fail the job.
          flake8 src/ tests/ scripts/ --count --show-source --statistics

  test-suite:
    name: Unit & Integration Tests (${{ matrix.os }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify Environment & Package Scaffolding
        run: |
          python -c "import src.data, src.rules, src.models, src.tracking, src.ui, src.utils; print('All core modules imported successfully!')"

      - name: Run PyTest Test Suite
        run: |
          pytest tests/ -v --durations=10

  streamlit-smoke-test:
    name: Streamlit Headless Smoke Test
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify Streamlit App Launches Headless
        run: |
          if [ ! -f src/ui/app.py ]; then
            echo "src/ui/app.py does not exist yet (UI work not started) - skipping smoke test."
            exit 0
          fi
          # Run streamlit in headless mode in the background and verify it starts
          nohup streamlit run src/ui/app.py --server.headless true --server.port 8501 &
          sleep 5
          curl -I http://localhost:8501 || exit 1
          echo "Streamlit server booted and responded successfully!"
